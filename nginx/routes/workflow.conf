# Saga reservar, property-workflow (ADR-009). The workflow validates the token itself.
location /api/v1/sagas {
    include /etc/nginx/snippets/protected.conf;
    default_type application/json;
    limit_req zone=per_client burst=20 nodelay;
    # A variable forces per-request resolution (see 00-resolver.conf).
    set $upstream http://workflow:3006;
    proxy_pass $upstream;
    # A Saga calls Booking and Payment in sequence: its limit must stay below
    # this one (workflow-endpoint-fiches.md, "Retries and limits").
    proxy_read_timeout 60s;
}
