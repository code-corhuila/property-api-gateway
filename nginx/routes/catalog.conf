# Catalog (property-catalog-api). Public: browsing needs no credential.
location /api/v1/propiedades {
    include /etc/nginx/snippets/public.conf;
    default_type application/json;
    limit_req zone=per_client burst=20 nodelay;
    # A variable forces per-request resolution (see 00-resolver.conf).
    set $upstream http://catalog-api:3002;
    proxy_pass $upstream;
}
