# Identity (property-identity-api). Its paths are not domain nouns
# (07-api/guidelines.md, D-C2). Creating or renewing a session and reading the
# public key need no credential; the rest does (api-gateway.yaml).

# A07: at most 10 login attempts per IP in 5 minutes.
location = /api/v1/login {
    include /etc/nginx/snippets/public.conf;
    default_type application/json;
    limit_req zone=login burst=9 nodelay;
    set $upstream http://identity-api:3004;
    proxy_pass $upstream;
}

location ~ ^/api/v1/(register|refresh|jwks)$ {
    include /etc/nginx/snippets/public.conf;
    default_type application/json;
    limit_req zone=per_client burst=20 nodelay;
    set $upstream http://identity-api:3004;
    proxy_pass $upstream;
}

# E-26, GET /users/{id}/contact, is internal: only notification-service calls it, inside the
# network platform, with svc-notification (DOC4, GAP-017; least privilege). From outside it
# does not exist. It is declared before the rule of /users, so it is matched first.
location ~ ^/api/v1/users/[^/]+/contact/?$ {
    default_type application/json;
    return 404 '{"error":"NOT_FOUND","message":"the route does not exist","traceId":"$correlation_id"}';
}

location ~ ^/api/v1/(logout|users)(/|$) {
    include /etc/nginx/snippets/protected.conf;
    default_type application/json;
    limit_req zone=per_client burst=20 nodelay;
    set $upstream http://identity-api:3004;
    proxy_pass $upstream;
}
