server {
    listen 8080;    # the gateway in develop: http://localhost:8080 (deployment.md)

    include /etc/nginx/snippets/headers.conf;

    proxy_set_header X-Correlation-Id $correlation_id;
    # The service echoes the same id; headers.conf already returns it once.
    proxy_hide_header X-Correlation-Id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;

    # Errors the gateway produces itself answer with the common envelope
    # (api-gateway.yaml, GatewayErrorResponse). Errors a service returns pass
    # through untouched: it already used the envelope.
    error_page 429 @too_many_requests;
    error_page 502 503 504 =503 @unavailable;

    include /etc/nginx/routes/*.conf;

    location / {
        default_type application/json;
        return 404 '{"error":"NOT_FOUND","message":"the route does not exist","traceId":"$correlation_id"}';
    }

    location @too_many_requests {
        include /etc/nginx/snippets/headers.conf;
        add_header Retry-After $retry_after always;
        default_type application/json;
        return 429 '{"error":"TOO_MANY_REQUESTS","message":"too many requests","traceId":"$correlation_id"}';
    }

    location @unavailable {
        default_type application/json;
        return 503 '{"error":"SERVICE_UNAVAILABLE","message":"the service is not available","traceId":"$correlation_id"}';
    }
}
