# Rate limiting. General: 10 requests/second per client, bursts of 20.
limit_req_zone $binary_remote_addr zone=per_client:10m rate=10r/s;
# POST /api/v1/login: at most 10 attempts per IP in 5 minutes
# (00-governance/security-rules.md, A07): 2 per minute, a first burst of 10.
limit_req_zone $binary_remote_addr zone=login:10m rate=2r/m;
limit_req_status 429;

# How long a client waits after a 429: one new login attempt every 30 seconds.
map $uri $retry_after {
    default          1;
    /api/v1/login    30;
}

# Correlation: reuse the X-Correlation-Id the client sent, or create one. It goes
# to the service, back to the client, and into every access-log line.
map $http_x_correlation_id $correlation_id {
    default $http_x_correlation_id;
    ""      $request_id;
}

# Cheap credential filter: a protected route with no Authorization header is
# rejected here, before reaching any service. This is NOT token validation: every
# service validates the token itself (07-api/guidelines.md, D-C11).
map $http_authorization $missing_auth {
    default 0;
    ""      1;
}
